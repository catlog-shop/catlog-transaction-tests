name: Catlog base tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:base:logging
      - name: Test the hosted base API
        run: npm test
        env:
          CATLOG_TEST_API_KEY: ${{ secrets.CATLOG_TEST_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catlog-base-summary
          path: reports/base-*/base-summary.json
          if-no-files-found: warn
