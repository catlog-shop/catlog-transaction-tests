name: Stellar testnet payment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stellar-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:testnet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stellar-testnet-results
          path: reports/stellar-testnet*
          if-no-files-found: warn
