name: Catlog backend API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:reporting
      - name: Test the private Catlog backend through Catlog API
        run: npm test
        env:
          CATLOG_API_KEY: ${{ secrets.CATLOG_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catlog-test-reports
          path: reports/catlog-*/
          if-no-files-found: warn
